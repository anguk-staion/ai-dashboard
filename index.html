<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>동종사 AI 조직운영 현황 · 8개 건설사 AI협의체</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  @font-face {
    font-family: 'Pretendard Variable';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #121417;
    --ink-2: #3c424b;
    --ink-3: #6b7280;
    --line: #e5e7eb;
    --line-strong: #cfd3d9;
    --accent: #0b2545;        /* deep navy */
    --accent-2: #1d3557;
    --accent-soft: #eaf0fb;
    --mint: #14b8a6;
    --amber: #d97706;
    --red: #dc2626;
    --chip-bg: #f0f2f5;
    --radius: 10px;
    --shadow-sm: 0 1px 2px rgba(17,24,39,.04), 0 1px 3px rgba(17,24,39,.05);
    --shadow-md: 0 4px 12px rgba(17,24,39,.06), 0 2px 4px rgba(17,24,39,.04);
    --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    --font-mono: 'Pretendard Variable', Pretendard, ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 25px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  /* ── Top Bar ─────────────────────────────── */
  .topbar {
    background: var(--accent);
    color: #fff;
    border-bottom: 1px solid #091b36;
  }
  .topbar-inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, #ffffff 0%, #bcd0ee 100%);
    color: var(--accent);
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.03em;
  }
  .brand-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand-sub {
    font-size: 11.5px;
    color: #bcd0ee;
    letter-spacing: 0.02em;
    margin-top: 1px;
  }
  .topbar-actions {
    display: flex;
    gap: 6px;
  }
  .btn {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: inherit;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    border-radius: 7px;
    cursor: pointer;
    transition: all .15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-ghost-light {
    color: #d8e3f5;
    border-color: rgba(255,255,255,.18);
  }
  .btn-ghost-light:hover { background: rgba(255,255,255,.1); color: #fff; }
  .save-state-top {
    font-size: 11.5px;
    color: #bcd0ee;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding-right: 8px;
  }

  .btn-primary {
    background: #fff;
    color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover { background: #eaf0fb; }

  /* ── Hero / Title ─────────────────────────────── */
  .hero {
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 28px 18px;
  }
  .hero-title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.035em;
    margin: 0;
    color: var(--ink);
  }
  .hero-title .accent-bar {
    display: inline-block;
    width: 4px;
    height: 22px;
    background: var(--accent);
    vertical-align: -3px;
    margin-right: 10px;
    border-radius: 2px;
  }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: center;
    margin-top: 8px;
    color: var(--ink-3);
    font-size: 12.5px;
  }
  .hero-meta .dot { width: 3px; height: 3px; background: var(--line-strong); border-radius: 50%; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .status-pill::before {
    content: '';
    display: block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* ── Company Tabs ─────────────────────────────── */
  .company-tabs-wrap {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 28px;
  }
  .company-tabs {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .company-tab {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 10px;
    cursor: pointer;
    transition: all .18s ease;
    text-align: center;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .company-tab:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .company-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 6px 16px rgba(11,37,69,.24);
  }
  .company-tab-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: inherit;
  }
  .company-tab-revenue {
    font-size: 10.5px;
    color: var(--ink-3);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .company-tab.active .company-tab-revenue { color: #bcd0ee; }
  .company-tab.no-data::after {
    content: '데이터 없음';
    position: absolute;
    top: 6px; right: 6px;
    font-size: 9px;
    color: var(--ink-3);
    background: var(--chip-bg);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .company-tab.active.no-data::after { background: rgba(255,255,255,.15); color: #bcd0ee; }

  /* ── Sub-category Tabs (조직/예산/인프라/중점) ─── */
  .section-tabs {
    max-width: 1440px;
    margin: 22px auto 0;
    padding: 0 28px;
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--line);
  }
  .section-tab {
    background: transparent;
    border: none;
    padding: 13px 22px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all .15s ease;
    letter-spacing: -0.01em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .section-tab:hover { color: var(--ink); }
  .section-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .section-tab-num {
    display: inline-grid;
    place-items: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--chip-bg);
    color: var(--ink-3);
    font-size: 10.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .section-tab.active .section-tab-num {
    background: var(--accent);
    color: #fff;
  }

  /* ── Content Area ─────────────────────────────── */
  .content {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px 28px 80px;
  }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
    gap: 16px;
  }
  .section-header h2 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--ink);
  }
  .section-header .section-subtitle {
    color: var(--ink-3);
    font-size: 18px;
    margin-top: 4px;
  }
  .section-header .current-company {
    color: var(--accent);
    font-weight: 600;
  }
  .panel {
    display: none;
  }
  .panel.active { display: block; animation: fade .22s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Card / Grid ─────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card + .card { margin-top: 14px; }
  .card-head {
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafbfc;
  }
  .card-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .card-title-badge {
    display: inline-grid;
    place-items: center;
    padding: 2px 7px;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .card-body {
    padding: 18px;
  }

  /* ── Inputs ─────────────────────────────── */
  .field-label {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    display: block;
  }
  .input, .textarea, .select {
    width: 100%;
    font-family: inherit;
    font-size: 25px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px 14px;
    transition: all .15s ease;
    letter-spacing: -0.005em;
  }
  .input:hover, .textarea:hover, .select:hover {
    border-color: var(--line-strong);
  }
  .input:focus, .textarea:focus, .select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(11,37,69,.12);
  }
  .input-num {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .textarea {
    resize: vertical;
    min-height: 68px;
    line-height: 1.55;
  }
  .input-affix {
    position: relative;
  }
  .input-affix .affix {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-3);
    font-size: 11.5px;
    pointer-events: none;
    font-weight: 500;
  }
  .input-affix .input { padding-right: 38px; }

  /* ── Budget panel ─────────────────────────────── */
  .budget-summary {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 14px;
  }
  .summary-chip {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    min-width: 110px;
    position: relative;
  }
  .summary-chip::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    border-radius: 8px 0 0 8px;
  }
  .summary-chip.alt::before { background: var(--mint); }
  .summary-chip.calc::before { background: var(--amber); }
  .summary-chip-label {
    font-size: 16px;
    color: var(--ink-3);
    font-weight: 600;
    letter-spacing: -0.005em;
    margin-bottom: 2px;
  }
  .summary-chip-value {
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .summary-chip-value .unit {
    font-size: 11px;
    color: var(--ink-3);
    font-weight: 500;
    margin-left: 2px;
  }
  .summary-chip.calc .summary-chip-value { color: var(--amber); }

  .budget-rows {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .budget-row {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 22px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 18px;
    align-items: center;
    position: relative;
  }
  .budget-row::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 10px 0 0 10px;
  }
  .budget-row.alt::before { background: var(--mint); }
  .budget-row.calc::before { background: var(--amber); }
  .budget-row-label {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .budget-row-hint {
    font-size: 17px;
    color: var(--ink-3);
    margin-top: 4px;
    font-weight: 500;
  }
  .budget-row-value {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .budget-row-value input {
    width: 200px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 12px;
    background: #fdfdfe;
    text-align: right;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    transition: all .15s;
  }
  .budget-row-value input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 2px rgba(11,37,69,.1);
  }
  .budget-row-value .unit {
    font-size: 14px;
    color: var(--ink-3);
    font-weight: 600;
    min-width: 28px;
  }
  .budget-row-value .calc-value {
    width: 200px;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--amber);
    text-align: right;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    padding: 7px 12px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 7px;
    display: inline-block;
  }
  .budget-row-value .calc-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    background: var(--amber);
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 8px;
    letter-spacing: 0.04em;
    vertical-align: middle;
  }

  /* ── Infrastructure panel ─────────────────────────────── */
  .infra-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .infra-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .infra-card-head {
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    background: #fafbfc;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .infra-card-head h4 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .infra-card-head h4 .badge {
    display: inline-grid;
    place-items: center;
    width: 30px; height: 30px;
    background: transparent;
    color: var(--accent);
    border-radius: 5px;
    font-size: 15px;
    font-weight: 800;
  }
  .infra-card-hint {
    font-size: 17px;
    color: var(--ink-3);
    font-weight: 500;
  }
  .infra-card-body {
    padding: 14px 18px 16px;
  }
  .infra-card textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 25px;
    color: var(--ink-2);
    resize: vertical;
    min-height: 90px;
    line-height: 1.6;
    background: #fdfdfe;
    transition: all .15s;
  }
  .infra-card textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 2px rgba(11,37,69,.1);
  }

  .option-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option-row {
    display: grid;
    grid-template-columns: 22px 190px 1fr;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    background: #fafbfc;
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: all .15s ease;
  }
  .option-row:hover {
    border-color: var(--line-strong);
    background: #f5f7fa;
  }
  .option-row.checked {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .option-row input[type="checkbox"],
  .option-row input[type="radio"] {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }
  .option-row .option-label {
    font-weight: 600;
    font-size: 22px;
    color: var(--ink-2);
    user-select: none;
    cursor: pointer;
    letter-spacing: -0.005em;
  }
  .option-row.checked .option-label {
    color: var(--accent);
    font-weight: 700;
  }
  .option-row .option-memo {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 23px;
    color: var(--ink-2);
    background: #fff;
    transition: all .15s;
  }
  .option-row .option-memo:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(11,37,69,.1);
  }
  .option-row .option-memo::placeholder {
    color: #b7bcc4;
  }

  /* ── Organization panel ─────────────────────────────── */
  .org-top-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 14px;
  }
  .org-top-row-left {
    flex: 1;
    max-width: 480px;
  }

  .org-total-bar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .org-total-main {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .org-total-label {
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .org-total-hint {
    font-size: 18px;
    color: var(--ink-3);
  }
  .org-total-sum {
    font-size: 18px;
    color: var(--ink-3);
    font-weight: 500;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 8px 14px;
    background: var(--accent-soft);
    border-radius: 8px;
  }
  .org-total-sum strong {
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .org-total-sum span { color: var(--accent); font-weight: 600; }

  .org-columns {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .org-col {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .org-col-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: #fafbfc;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .org-col-title {
    font-weight: 700;
    font-size: 22px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .org-col-title .pill {
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .org-col-title .pill.ax { background: #0891b2; }
  .org-col-title .pill.dx { background: #7c3aed; }
  .org-col-title .pill.it { background: #475569; }

/* ═════════════════════════════════════════════════════════════
   State & Storage
   ═════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'construction_ai_dashboard_v2';
let state = structuredClone(DEFAULT_DATA);
let currentCompany = COMPANIES[0];
let currentSection = 'organization';

async function loadState() {
  // 1) Supabase에서 먼저 로드
  try {
    const remote = await loadFromSupabase();
    if (remote && Object.keys(remote).length > 0) {
      const merged = structuredClone(DEFAULT_DATA);
      for (const c of COMPANIES) {
        if (remote[c]) merged[c] = { ...merged[c], ...remote[c] };
      }
      return merged;
    }
  } catch(e) {
    console.warn('Supabase 로드 실패, 기본값 사용:', e);
  }
  // 2) 실패시 DEFAULT_DATA 반환
  return structuredClone(DEFAULT_DATA);
}

let saveTimer;
function scheduleSave() {
  setSaving(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      saveToSupabase(state);
      setSaving(false, true);
    } catch (e) {
      alert('저장 실패: ' + e.message);
      setSaving(false, false);
    }
  }, 400);
}

function manualSave() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    saveToSupabase(state);
    flashSave('수동 저장 완료');
  } catch (e) {
    alert('저장 실패: ' + e.message);
  }
}

function setSaving(isSaving, ok = true) {
  const dot = document.getElementById('saveDot');
  const label = document.getElementById('saveLabel');
  if (isSaving) {
    dot.classList.add('saving');
    label.textContent = '저장 중...';
  } else {
    dot.classList.remove('saving');
    label.textContent = ok ? '자동 저장됨' : '저장 오류';
  }
}

function flashSave(text) {
  const label = document.getElementById('saveLabel');
  const old = label.textContent;
  label.textContent = text;
  setTimeout(() => { label.textContent = old; }, 1800);
}

/* ═════════════════════════════════════════════════════════════

   ═════════════════════════════════════════════════════════════ */
function renderCompanyTabs() {
  const wrap = document.getElementById('companyTabs');
  wrap.innerHTML = COMPANIES.map(name => {
    const d = state[name];
    const hasData = d && d.revenue25 !== null && d.revenue25 !== undefined && d.revenue25 !== '';
    const revTxt = hasData ? Number(d.revenue25).toLocaleString() + '억' : '입력 필요';
    return `
      <button class="company-tab ${name === currentCompany ? 'active' : ''}"
              onclick="selectCompany('${name}')">
        <div class="company-tab-label">${name}</div>
      </button>
    `;
  }).join('');
}

function renderSectionTabs() {
  document.querySelectorAll('.section-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.section === currentSection);
    t.onclick = () => { currentSection = t.dataset.section; renderAll(); };
  });
}

function renderContent() {
  const c = document.getElementById('content');
  if (currentSection === 'organization')   c.innerHTML = renderOrganization();
  else if (currentSection === 'budget')    c.innerHTML = renderBudget();
  else if (currentSection === 'infrastructure') c.innerHTML = renderInfrastructure();
  else if (currentSection === 'initiatives') c.innerHTML = renderInitiatives();
  bindInputs();
}

function calcBudgetPct(d) {
  const rev = Number(d.revenue25);

  return (bud / rev) * 100;
}

          <textarea data-bind-infra="devEnv" placeholder="개발 환경 · 인프라 · 라이선스 관리 체계 등 자유 기재">${escapeText(inf.devEnv || '')}</textarea>
        </div>
      </div>

    </div>
  `;
}

function renderCheckOption(catKey, opt, val) {
  const checked = !!val.used;
  const memo = val.memo || '';
  const id = `opt-${catKey}-${optToId(opt)}`;
  return `
    <div class="option-row ${checked ? 'checked' : ''}" data-opt-row="${catKey}::${opt}">
      <input type="checkbox" id="${id}"
             data-opt-check="${catKey}::${opt}"
             ${checked ? 'checked' : ''}>
      <label class="option-label" for="${id}">${opt}</label>
      <input type="text" class="option-memo"
             data-opt-memo="${catKey}::${opt}"
             value="${escapeAttr(memo)}"
             placeholder="">
    </div>
  `;
}

function renderRadioOption(catKey, opt, val) {
  const selected = val.selected === opt;
  const memo = (val.memos && val.memos[opt]) || '';
  const id = `opt-${catKey}-${optToId(opt)}`;
  return `
    <div class="option-row ${selected ? 'checked' : ''}" data-opt-row="${catKey}::${opt}">
      <input type="radio" id="${id}" name="${catKey}"
             data-opt-radio="${catKey}::${opt}"
             ${selected ? 'checked' : ''}>
      <label class="option-label" for="${id}">${opt}</label>
      <input type="text" class="option-memo"
             data-opt-radio-memo="${catKey}::${opt}"
             value="${escapeAttr(memo)}"
             placeholder="">
    </div>
  `;
}

function optToId(s) {
  return s.replace(/\s+/g, '_').replace(/[^\w가-힣]/g, '');
}

/* ── Initiatives ─────────────────────────── */
function renderInitiatives() {
  const d = state[currentCompany];
  return `
    <div class="section-header">
      <div>
        <h2>④ 중점 추진현황</h2>
        <div class="section-subtitle">'26년 주요 추진 과제 · 제도 · 문화 · 기술 확산 계획</div>
      </div>
    </div>
    <div class="initiatives-wrap">
      <textarea data-bind="initiatives"
                placeholder="">${escapeText(d.initiatives || '')}</textarea>
      <div class="initiatives-hint">Enter 키로 줄바꿈 · 이모지 · 특수 기호 사용 가능합니다.</div>
    </div>
  `;
}

/* ═════════════════════════════════════════════════════════════
   Binding
   ═════════════════════════════════════════════════════════════ */
function bindInputs() {
  // Simple field bind
  document.querySelectorAll('[data-bind]').forEach(el => {
    el.oninput = () => {
      const key = el.dataset.bind;
      state[currentCompany][key] = parseValue(el);
      scheduleSave();
      if (key === 'revenue25') renderCompanyTabs();
      if (key === 'operationMode') {
        const desc = el.closest('.custom-select-wrap')?.querySelector('.custom-select-desc');
        if (desc) {
          const map = { '통합': 'AI 관련 단 하나의 조직 아래 통합 운영', '개별': 'AI 관련 단위를 여러 부서에 나누어서 운영', '혼합': '통합 조직이 있으나 일부 개별 운영' };
          desc.textContent = map[el.value] || '';
        }
      }
    };
    el.onchange = el.oninput;

    // For comma-formatted numeric inputs:
    // - on focus: strip commas so user can edit naturally
    // - on blur: re-format with commas
    if (el.dataset && el.dataset.numeric) {
      el.onfocus = () => {
        const n = state[currentCompany][el.dataset.bind];
        if (n !== null && n !== undefined && n !== '') {
          el.value = String(n);
          el.select();
        }
      };
      el.onblur = () => {
        const key = el.dataset.bind;
        const n = state[currentCompany][key];
        el.value = formatNum(n, el.dataset.numeric === 'int' ? 0 : 4);
      };
    }
  });

  // Infra bind
  document.querySelectorAll('[data-bind-infra]').forEach(el => {
    el.oninput = () => {
      const key = el.dataset.bindInfra;
      if (!state[currentCompany].infrastructure) state[currentCompany].infrastructure = {};
      state[currentCompany].infrastructure[key] = el.value;
      scheduleSave();
    };
  });

  // Infra checkbox bind
  document.querySelectorAll('[data-opt-check]').forEach(el => {
    el.onchange = () => {
      const [catKey, opt] = el.dataset.optCheck.split('::');
      if (!state[currentCompany].infrastructure[catKey]) state[currentCompany].infrastructure[catKey] = {};
      if (!state[currentCompany].infrastructure[catKey][opt]) state[currentCompany].infrastructure[catKey][opt] = {};
      state[currentCompany].infrastructure[catKey][opt].used = el.checked;
      // update row style
      const row = el.closest('[data-opt-row]');
      if (row) row.classList.toggle('checked', el.checked);
      scheduleSave();
    };
  });

  // Infra checkbox memo bind
  document.querySelectorAll('[data-opt-memo]').forEach(el => {
    el.oninput = () => {
      const [catKey, opt] = el.dataset.optMemo.split('::');
      if (!state[currentCompany].infrastructure[catKey]) state[currentCompany].infrastructure[catKey] = {};
      if (!state[currentCompany].infrastructure[catKey][opt]) state[currentCompany].infrastructure[catKey][opt] = {};
      state[currentCompany].infrastructure[catKey][opt].memo = el.value;
      scheduleSave();
    };
  });

  // Infra radio bind
  document.querySelectorAll('[data-opt-radio]').forEach(el => {
    el.onchange = () => {
      const [catKey, opt] = el.dataset.optRadio.split('::');
      if (!state[currentCompany].infrastructure[catKey]) state[currentCompany].infrastructure[catKey] = {};
      state[currentCompany].infrastructure[catKey].selected = opt;
      // update row styles
      document.querySelectorAll(`[data-opt-row^="${catKey}::"]`).forEach(row => {
        row.classList.toggle('checked', row.dataset.optRow === `${catKey}::${opt}`);
      });
      scheduleSave();
    };
  });

  // Infra radio memo bind
  document.querySelectorAll('[data-opt-radio-memo]').forEach(el => {
    el.oninput = () => {
      const [catKey, opt] = el.dataset.optRadioMemo.split('::');
      if (!state[currentCompany].infrastructure[catKey]) state[currentCompany].infrastructure[catKey] = {};
      if (!state[currentCompany].infrastructure[catKey].memos) state[currentCompany].infrastructure[catKey].memos = {};
      state[currentCompany].infrastructure[catKey].memos[opt] = el.value;
      scheduleSave();
    };
  });

  // Team bind
  document.querySelectorAll('[data-bind-team]').forEach(el => {
    el.oninput = () => {
      const [cat, idx, field] = el.dataset.bindTeam.split('.');
      const item = state[currentCompany].organization[cat][Number(idx)];
      if (field === 'count') {
        item.count = Number(el.value) || 0;
        // update column total inline
        const col = el.closest('.org-col');
        if (col) {
          const cat2 = col.querySelector('.org-teams').dataset.cat;
          const total = sumCount(state[currentCompany].organization[cat2]);
          col.querySelector('.org-total strong').textContent = total;
        }
        // update header total
        const org = state[currentCompany].organization;
        const totalAll = sumCount(org.aiOverall)+sumCount(org.ax)+sumCount(org.dx)+sumCount(org.it);
        const hdr = document.querySelector('.section-header strong');
        if (hdr) hdr.textContent = totalAll + '명';
      } else if (field === 'dept1' || field === 'dept2' || field === 'dept3') {
        item[field] = el.value;
      } else {
        item[field] = el.value;
      }
      scheduleSave();
    };
  });
}

function parseValue(el) {
  // Comma-formatted numeric input (data-numeric="int" or "decimal")
  if (el.dataset && el.dataset.numeric) {
    const cleaned = String(el.value).replace(/,/g, '').trim();
    if (cleaned === '' || cleaned === '-' || cleaned === '.') return null;
    const n = Number(cleaned);
    return isNaN(n) ? null : n;
  }
  if (el.type === 'number') {
    return el.value === '' ? null : Number(el.value);
  }
  return el.value;
}

// Format a number with thousand separators; maxDecimals preserves precision when needed
function formatNum(v, maxDecimals) {
  if (v === null || v === undefined || v === '') return '';
  const n = Number(v);
  if (isNaN(n)) return '';
  if (maxDecimals !== undefined) {
    return n.toLocaleString('en-US', { maximumFractionDigits: maxDecimals });
  }
  return n.toLocaleString('en-US', { maximumFractionDigits: 4 });
}

/* ═════════════════════════════════════════════════════════════
   Actions
   ═════════════════════════════════════════════════════════════ */
function selectCompany(name) {
  currentCompany = name;
  renderAll();
}

function addTeam(catKey) {
  state[currentCompany].organization[catKey].push({ team: '', count: 0, desc: '' });
  scheduleSave();
  renderContent();
}

function removeTeam(catKey, idx) {
  const arr = state[currentCompany].organization[catKey];
  if (arr.length <= 1) {
    // keep at least one empty row
    arr[0] = { team: '', count: 0, desc: '' };
  } else {
    arr.splice(idx, 1);
  }
  scheduleSave();
  renderContent();
}

function exportExcel() {
  // CSV 형태로 만들어서 엑셀로 저장
  const rows = [];
  // 헤더
  rows.push(['건설사', '운영방식', 'AI총괄팀명', 'AI총괄인원', 'AX팀명', 'AX인원', 'DX팀명', 'DX인원', 'IT팀명', 'IT인원', '25매출(억)', '26AI예산(억)', '협업툴', '일반업무AI', '도메인AI', '외부AI차단']);

  for (const name of COMPANIES) {
    const d = state[name];
    const org = d.organization || {};
    const inf = d.infrastructure || {};

    const teamStr = (arr) => (arr||[]).map(t=>t.team).filter(Boolean).join(' / ');
    const countStr = (arr) => (arr||[]).reduce((s,t)=>s+(Number(t.count)||0),0);

    const collab = Object.entries(inf.collab||{}).filter(([,v])=>v.used).map(([k])=>k).join(', ');
    const genAI = Object.entries(inf.generalAI||{}).filter(([,v])=>v.used).map(([k,v])=>k+(v.memo?`(${v.memo})`:``) ).join(', ');
    const block = (inf.externalBlock||{}).selected || '';

    rows.push([
      name,
      d.operationMode || '',
      teamStr(org.aiOverall), countStr(org.aiOverall),
      teamStr(org.ax), countStr(org.ax),
      teamStr(org.dx), countStr(org.dx),
      teamStr(org.it), countStr(org.it),
      d.revenue25 || '',
      d.aiBudget26 || '',
      collab,
      genAI,
      inf.domainAI || '',
      block,
    ]);
  }

  // BOM 추가로 한글 깨짐 방지
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `AI협의체_동종사현황_${stamp}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  flashSave('엑셀 파일 저장됨');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[T:]/g, '-');
  a.href = url;
  a.download = `AI협의체_동종사현황_${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
  flashSave('JSON 파일 다운로드됨');
}

function importJSON(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (typeof parsed !== 'object') throw new Error('형식이 올바르지 않습니다.');
      // merge
      for (const c of COMPANIES) {
        if (parsed[c]) state[c] = { ...DEFAULT_DATA[c], ...parsed[c] };
      }
      scheduleSave();
      renderAll();
      flashSave('불러오기 완료');
    } catch (err) {
      alert('불러오기 실패: ' + err.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

function resetAll() {
  if (!confirm('모든 입력값을 기본값으로 초기화하시겠습니까?\n(저장된 수정사항이 사라집니다.)')) return;
  state = structuredClone(DEFAULT_DATA);
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  renderAll();
  flashSave('초기화 완료');
}

/* ═════════════════════════════════════════════════════════════
   Helpers
   ═════════════════════════════════════════════════════════════ */
function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeText(s) {
  return String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderAll() {
  renderCompanyTabs();
  renderSectionTabs();
  renderContent();
}

/* Init */
loadState().then(loaded => {
  state = loaded;
  renderAll();
});
</script>
